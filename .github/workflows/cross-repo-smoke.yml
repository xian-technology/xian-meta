name: Cross Repo Smoke

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

env:
  XIAN_JS_FLOATING_REF: main
  XIAN_JS_PINNED_REF: 9fbc6d4ba345ded93ce87818d307e4f53c86c738

jobs:
  smoke:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: xian-wallet-browser
            node-version: "24"
            floating_ref: main
            pinned_ref: 907a5130f983a4b1885e34b6b420a98fcfa81cb6
          - repo: xian-wallet-mobile
            node-version: "24"
            floating_ref: main
            pinned_ref: 12b84afbd0a2eebb15949d2c31088235b0272eee

    steps:
      - name: Check out xian-meta
        uses: actions/checkout@v6
        with:
          path: xian-meta
          persist-credentials: false

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          ref: ${{ github.event_name == 'pull_request' && matrix.floating_ref || matrix.pinned_ref }}
          path: ${{ matrix.repo }}
          persist-credentials: false

      - name: Check out xian-js
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-js
          ref: ${{ github.event_name == 'pull_request' && env.XIAN_JS_FLOATING_REF || env.XIAN_JS_PINNED_REF }}
          path: xian-js
          persist-credentials: false

      - name: Report resolved SHAs
        env:
          TARGET_REPO: ${{ matrix.repo }}
          TARGET_REF: ${{ github.event_name == 'pull_request' && matrix.floating_ref || matrix.pinned_ref }}
          XIAN_JS_REF: ${{ github.event_name == 'pull_request' && env.XIAN_JS_FLOATING_REF || env.XIAN_JS_PINNED_REF }}
        run: |
          {
            echo "### Cross-repo smoke resolved SHAs"
            echo
            echo "| repo | configured ref | resolved SHA |"
            echo "| --- | --- | --- |"
            echo "| xian-meta | \`${GITHUB_SHA}\` | \`$(git -C xian-meta rev-parse HEAD)\` |"
            echo "| ${TARGET_REPO} | \`${TARGET_REF}\` | \`$(git -C "${TARGET_REPO}" rev-parse HEAD)\` |"
            echo "| xian-js | \`${XIAN_JS_REF}\` | \`$(git -C xian-js rev-parse HEAD)\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            xian-js/package-lock.json
            ${{ matrix.repo }}/package-lock.json

      - name: Build xian-js for wallet smoke tests
        working-directory: xian-js
        run: |
          npm ci
          npm run build

      - name: Smoke xian-wallet-browser
        if: matrix.repo == 'xian-wallet-browser'
        working-directory: xian-wallet-browser
        run: |
          npm ci
          npm run typecheck
          npm test -- apps/wallet-extension/src/shared/storage.test.ts packages/wallet-core/tests/controller.test.ts

      - name: Smoke xian-wallet-mobile
        if: matrix.repo == 'xian-wallet-mobile'
        working-directory: xian-wallet-mobile
        run: |
          npm ci
          npm run typecheck
          npm test -- src/lib/__tests__/wallet-controller.test.ts
